<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cooldown Stage Frame</title>
<!-- 1920x1080 backdrop for the presentation master; build.sh composites the vertical video into the card. -->
<link rel="stylesheet" href="../node_modules/@fontsource-variable/fraunces/full.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/fraunces/full-italic.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/bricolage-grotesque/standard.css">
<link rel="stylesheet" href="../node_modules/@fontsource/nanum-pen-script/index.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #F2EBDD; color: #1C1A17; }
#grain { position: absolute; inset: 0; opacity: .32; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .11  0 0 0 0 .1  0 0 0 0 .09  0 0 0 -1.6 1.05'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
/* the video card sits at (679, 40), 562x1000 */
#card { position: absolute; left: 673px; top: 34px; width: 574px; height: 1012px; border-radius: 34px; background: #1C1A17; box-shadow: 18px 18px 0 #1C1A17; }
.side { position: absolute; top: 0; bottom: 0; width: 580px; display: flex; flex-direction: column; justify-content: center; }
#left { left: 70px; }
#right { right: 70px; text-align: right; align-items: flex-end; }
.mark { width: 120px; height: 120px; }
.word { font-family: 'Fraunces Variable'; font-weight: 900; font-variation-settings: "SOFT" 100, "WONK" 1; font-size: 110px; letter-spacing: -.045em; line-height: 1; margin-top: 18px; }
.tag { font-family: 'Nanum Pen Script'; font-size: 58px; color: #2F58C7; margin-top: 14px; }
.big { font-family: 'Fraunces Variable'; font-weight: 900; font-variation-settings: "SOFT" 100, "WONK" 1; font-size: 68px; line-height: 1; letter-spacing: -.03em; }
.big em { font-style: italic; color: #E9502F; }
.small { font-family: 'Bricolage Grotesque Variable'; font-weight: 700; font-size: 26px; letter-spacing: .16em; text-transform: uppercase; color: #6E645D; margin-top: 26px; }
</style>
</head>
<body>
<div class="side" id="left">
  <svg class="mark" viewBox="0 0 200 200">
    <rect x="26" y="30" width="160" height="160" rx="42" fill="#1C1A17"/>
    <rect x="12" y="14" width="160" height="160" rx="42" fill="#2F58C7" stroke="#1C1A17" stroke-width="10"/>
    <rect x="62" y="56" width="22" height="78" rx="11" fill="#FBF7EF"/>
    <rect x="100" y="56" width="22" height="78" rx="11" fill="#FBF7EF"/>
  </svg>
  <div class="word">cooldown</div>
  <div class="tag">the pause button for impulse buys</div>
</div>
<div class="side" id="right">
  <div class="big">Cool down<br>before you<br><em>check out.</em></div>
  <div class="small">Concept prototype · 60 s</div>
</div>
<div id="card"></div>
<div id="grain"></div>
<script>
window.seek = () => {};
window.ready = Promise.all(['900 100px "Fraunces Variable"', 'italic 900 100px "Fraunces Variable"', '700 26px "Bricolage Grotesque Variable"', '400 40px "Nanum Pen Script"']
  .map(f => document.fonts.load(f))).then(() => document.fonts.ready).then(() => true);
</script>
</body>
</html>
