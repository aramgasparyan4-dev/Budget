<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>MyGarage Drive</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230077ff'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23fff'/%3E%3Cpath d='M7.4 14.2h6.3M18.3 14.2h6.3M16 18.6v6.2' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- shown the moment the page arrives, before any script runs; React replaces it -->
    <div id="root">
      <style>
        .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #fff; font-family: 'Inter Variable', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0d0d0d; }
        .boot-mark { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: clamp(26px, 5vw, 40px); letter-spacing: -0.02em; }
        .boot-mark span { font-weight: 600; color: #5b5a5c; }
        .boot-bar { width: 240px; height: 4px; border-radius: 4px; background: #eaeaea; overflow: hidden; }
        .boot-bar div { width: 40%; height: 100%; border-radius: 4px; background: #0077ff; animation: boot 1.1s ease-in-out infinite; }
        @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      </style>
      <div class="boot">
        <div class="boot-mark">
          <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5" fill="none" stroke="#0077ff" stroke-width="3.2" /><circle cx="16" cy="16" r="3" fill="none" stroke="#0077ff" stroke-width="3" /><path d="M4.5 13.6h8.6M18.9 13.6h8.6M16 19v9" stroke="#0077ff" stroke-width="3" stroke-linecap="round" /></svg>
          <div>MyGarage <span>Drive</span></div>
        </div>
        <div class="boot-bar"><div></div></div>
      </div>
    </div>
    <script type="module" src="/src/mygarage/main.tsx"></script>
  </body>
</html>
