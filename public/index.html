<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <title>Ultron</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="offline">
  <canvas id="face" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">ULTRON</span>
      <span class="state" id="stateLabel">offline</span>
    </div>
    <div class="controls">
      <button class="chip" id="voiceToggle" type="button" aria-pressed="true" title="Speak replies aloud">Voice</button>
      <button class="chip" id="handsFreeToggle" type="button" aria-pressed="false" title="Listen again automatically after each reply">Hands-free</button>
      <button class="chip" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settings">Tune</button>
      <button class="chip" id="newBtn" type="button" title="Start a new conversation">New</button>
    </div>
  </header>

  <section class="settings" id="settings" hidden>
    <label>Voice
      <select id="voiceSelect"></select>
    </label>
    <label>Pitch <output id="pitchOut"></output>
      <input id="pitch" type="range" min="0" max="1.2" step="0.05">
    </label>
    <label>Speed <output id="rateOut"></output>
      <input id="rate" type="range" min="0.6" max="1.4" step="0.05">
    </label>
    <button class="chip" id="testVoice" type="button">Test</button>
  </section>

  <main class="stage">
    <div class="log" id="log" role="log" aria-live="polite"></div>
  </main>

  <footer class="dock">
    <div class="status" id="status" aria-live="polite"></div>
    <form class="composer" id="composer" autocomplete="off">
      <button class="mic" id="micBtn" type="button" aria-pressed="false" aria-label="Talk">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z" fill="currentColor"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Speak, or type here" aria-label="Message"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 20.5v-7l9-1.5-9-1.5v-7L22 12 3 20.5Z" fill="currentColor"/></svg>
      </button>
      <button class="stop" id="stopBtn" type="button" aria-label="Stop" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
      </button>
    </form>
    <p class="hint">Enter to send · Esc to silence · hold Space to talk</p>
  </footer>

  <div class="boot" id="boot">
    <div class="boot-inner">
      <p class="boot-kicker">dormant</p>
      <h1>ULTRON</h1>
      <button id="wakeBtn" type="button">Wake</button>
      <p class="boot-note" id="bootNote"></p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
